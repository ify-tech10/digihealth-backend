# DiGi Health backend configuration.
# Secrets never live in this file. They come from environment variables:
#   - locally: a .env file in the project root (git-ignored, see .env.example)
#   - on Render: the service's Environment tab
spring:
  application:
    name: digihealth-backend
  config:
    import: optional:file:.env[.properties]

  # Supabase PostgreSQL via the Session pooler (IPv4, port 5432)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5      # free tier allows few connections
      minimum-idle: 1
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # tables come from Flyway migrations only
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  # Resend SMTP. Username is the word "resend", password is the API key.
  # Port 2587 is Resend's alternative STARTTLS port; some hosts block 587.
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:2587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework   # Render sits behind a proxy

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    # comma-separated, e.g. http://localhost:5173,https://digihealth.onrender.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    name: ${BOOTSTRAP_ADMIN_NAME:DiGi Health Admin}
  tokens:
    jwt-secret: ${JWT_SECRET}          # at least 32 characters, random
    access-ttl: 15m                    # access token (memory only in the browser)
    remember-ttl: 30d                  # refresh cookie with "Remember me"
    session-ttl: 12h                   # refresh cookie without it (ends when the browser closes)
    cookie-secure: ${COOKIE_SECURE:true}
  mail:
    enabled: ${MAIL_ENABLED:true}      # false = log links to the console instead of emailing
    from: ${MAIL_FROM:onboarding@resend.dev}
    from-name: DiGi Health
  cloudinary:
    # Cloudinary dashboard > API Keys > "API environment variable":
    # cloudinary://<api_key>:<api_secret>@<cloud_name>
    url: ${CLOUDINARY_URL:}
