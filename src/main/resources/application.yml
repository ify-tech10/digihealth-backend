# DiGi Health backend configuration.
# Secrets never live in this file. They come from environment variables:
#   - locally: a .env file in the project root (git-ignored, see .env.example)
#   - on Render: the service's Environment tab
spring:
  application:
    name: digihealth-backend
  config:
    import: optional:file:.env[.properties]

  # Supabase PostgreSQL via the Session pooler (IPv4, port 5432)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5      # free tier allows few connections
      minimum-idle: 1
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # tables come from Flyway migrations only
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Resend SMTP (used from Phase 4)
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework   # Render sits behind a proxy

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    # comma-separated, e.g. http://localhost:5173,https://digihealth.onrender.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
